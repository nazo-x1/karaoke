[default]
# 本机IP和监听的端口，如果自动获取的IP错误，可在这里手动配置IP
# host = 0.0.0.0
port = 15233

# 系统数据目录（DB 等），绝对路径，必须存在
path = /KTV

# 手动上传落盘目录
keep_path = /KTV/__keep__

# 增强模式三件套目录
override_path = /KTV/__override__

# 扫描时跳过的目录名（任意嵌套层级）
keep_dir_name = __keep__
override_dir_name = __override__

# 扫描/上传允许的视频扩展名（逗号分隔）
scan_video_exts = mp4,mkv,avi,mov,webm,m4v

# 导入时是否 ffprobe 校验
ffprobe_on_import = true

# 去重策略：skip | overwrite | rename
default_duplicate_policy = skip

# 日志级别
level = INFO

# 同时进行的播放资源准备（ffmpeg）任务数，播放中可设为 1，空闲可适当增大
prepare_max_concurrent = 2
