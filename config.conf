[default]
# 本机IP和监听的端口，如果自动获取的IP错误，可在这里手动配置IP
# host = 0.0.0.0
port = 15233

# 上传的歌曲存在路径，绝对路径，必须存在
path = /KTV

# 日志级别
level = INFO

gunicornCmd = gunicorn

[separator]
sidecar_url = http://separator:8080
vocals_pattern = {out_dir}/{stem}_vocals.wav
accompaniment_pattern = {out_dir}/{stem}_instrumental.wav

[pipeline]
work_path = /work
placeholder_video = true

[import]
scan_path = /import
recursive = true
auto_separate = false
skip_incomplete = false
duplicate_policy = skip
include_glob = *
exclude_glob = *_origin.*,*_voice.*,*.tmp
min_size_bytes = 1024
skip_hidden = true
