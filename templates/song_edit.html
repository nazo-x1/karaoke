<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>编辑歌曲</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/toast.style.css">
    <script type="text/javascript" src="/static/js/jq.min.js"></script>
    <script type="text/javascript" src="/static/js/toast.script.js"></script>
    <style>
        body {
            display: block;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .edit-form { max-width: 720px; margin: 2rem auto; padding: 1rem 1.25rem 2rem; box-sizing: border-box; }
        .edit-form label { display: block; margin-top: 1rem; font-weight: bold; }
        .edit-form input[readonly] { background: #f5f5f5; width: 100%; padding: .5rem; box-sizing: border-box; }
        .edit-form input[type=text] { width: 100%; padding: .5rem; box-sizing: border-box; }
        .meta { color: #555; margin-top: .5rem; line-height: 1.6; }
        .actions { margin-top: 1.5rem; display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; }
        .actions a { color: #1565c0; }
        .hint { font-size: .9rem; color: #666; margin-top: .75rem; padding: .75rem; background: #fafafa; border-radius: 4px; line-height: 1.5; box-sizing: border-box; }
        .track-section { margin-top: .5rem; max-width: 100%; overflow-x: auto; }
        .track-section > label { margin-top: 0; }
        .track-table {
            width: 100%;
            max-width: 100%;
            border-collapse: collapse;
            margin-top: .75rem;
            font-size: .9rem;
            position: static;
            table-layout: fixed;
        }
        .track-table th, .track-table td {
            border: 1px solid #ddd;
            padding: .45rem .55rem;
            text-align: left;
            vertical-align: middle;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
        }
        .track-table th:nth-child(1), .track-table td:nth-child(1) { width: 2.5rem; text-align: center; white-space: nowrap; }
        .track-table th:nth-child(2), .track-table td:nth-child(2) { width: 28%; }
        .track-table th:nth-child(3), .track-table td:nth-child(3) { width: 12%; white-space: nowrap; }
        .track-table th:nth-child(4), .track-table td:nth-child(4) { width: 18%; }
        .track-table th:nth-child(5), .track-table td:nth-child(5) { width: auto; }
        .track-table th { background: #f5f5f5; font-weight: 600; }
        .track-table tbody tr:hover { background: #f9f9f9; }
        .track-table select { width: 100%; max-width: 100%; box-sizing: border-box; }
        #no-tracks { color: #888; margin-top: .75rem; }
    </style>
</head>
<body>
<div class="edit-form">
    <h2>编辑歌曲</h2>
    <label for="display-name">展示名</label>
    <input id="display-name" type="text" autocomplete="off">
    <label>源文件路径（只读）</label>
    <input id="source-path" type="text" readonly>
    <div class="meta" id="song-meta"></div>

    <label>内嵌音轨映射</label>
    <div class="track-section">
        <div class="hint" style="margin-top:0;">
            <strong>__override__ 三件套齐全时始终优先</strong>，下方内嵌配置仅在无完整 override 时生效。
        </div>
        <table class="track-table" id="track-table" style="display:none;">
            <thead>
                <tr><th>#</th><th>标题</th><th>语言</th><th>编码</th><th>角色</th></tr>
            </thead>
            <tbody id="track-body"></tbody>
        </table>
        <div id="no-tracks">暂无音轨信息，请点击「检测播放能力」</div>
    </div>

    <div class="hint">
        增强覆写目录 <code>/KTV/__override__/</code>：<br>
        <code>{展示名}.mp4</code>、<code>{展示名}_vocals.mp3</code>、<code>{展示名}_accompaniment.mp3</code>
    </div>
    <div class="actions">
        <button type="button" id="save-btn">保存</button>
        <button type="button" id="detect-playback-btn">检测播放能力</button>
        <button type="button" id="prepare-btn">预生成内嵌缓存</button>
        <a href="{{ prefix }}/">返回曲库</a>
    </div>
</div>
<script>
    localStorage.setItem("server", "{{ prefix }}");
    window.SONG_ID = {{ song_id }};
</script>
<script src="/static/js/core/config.js"></script>
<script src="/static/js/core/http.js"></script>
<script src="/static/js/domains/config.js"></script>
<script type="text/javascript" src="/static/js/pages/edit.page.js"></script>
</body>
</html>
