<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>卡拉OK</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/index.css">
    <link rel="stylesheet" href="/static/css/toast.style.css">
    <script type="text/javascript" src="/static/js/jq.min.js"></script>
    <script type="text/javascript" src="/static/js/toast.script.js"></script>
    <script type="text/javascript" src="/static/js/fenye.js"></script>
    <style>
        .scan-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; align-items: center; justify-content: center; }
        .scan-modal.open { display: flex; }
        .scan-panel { background: #fff; padding: 1.5rem; border-radius: 8px; min-width: 420px; max-width: 90vw; }
        .scan-panel label { display: block; margin: .5rem 0 .25rem; }
        .scan-panel input, .scan-panel select { width: 100%; padding: .4rem; box-sizing: border-box; }
        .scan-actions { margin-top: 1rem; display: flex; gap: .5rem; flex-wrap: wrap; }
        .scan-preview { margin-top: .75rem; font-size: .9rem; color: #444; max-height: 120px; overflow: auto; }
        .status-ok { color: #2e7d32; }
        .status-bad { color: #c62828; }
    </style>
</head>
<body>
<div class="container">
    <div class="head">
        <div style="display: flex; align-items: center; flex-wrap: wrap; gap: .5rem;">
            <input id="file-input" type="file" multiple accept="video/*,.mp4,.mkv,.avi,.mov,.webm,.m4v" style="display: none;">
            <input id="file-search" type="text" style="height: 30px; margin-left: 2px; margin-right: 8px;" placeholder="搜索曲库（管理）" autocomplete="off">
            <a href="#" id="file-upload">上传文件</a>
            <a href="#" id="scan-import">扫描导入</a>
            <a href="{{ prefix }}/sing" target="_blank">开始K歌</a>
        </div>
        <div style="display: flex; align-items: center; margin-top: 1rem; color: #666; font-size: .9rem;">
            点歌、已点队列与遥控请使用点歌台（RC）客户端或 Android TV 播放端。
            <span id="prepare-hint" style="margin-left: 1rem; color: #1565c0; display: none;"></span>
        </div>
    </div>
    <div style="margin-top: 3rem;">
        <table style="display: none;">
            <thead>
                <tr>
                    <th style="width: 28%;">名称</th>
                    <th style="width: 10%;">来源</th>
                    <th style="width: 10%;">模式</th>
                    <th style="width: 10%;">状态</th>
                    <th style="width: 18%;" id="create-time">创建时间</th>
                    <th style="width: 24%;">操作</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <div class="fenye"><ul id="paging" class="pagination"></ul></div>
</div>
<div class="modal_cover"><div class="modal_gif"></div></div>

<div class="scan-modal" id="scan-modal">
    <div class="scan-panel">
        <h3 style="margin-top:0;">扫描导入</h3>
        <label for="scan-root">扫描根路径（容器内绝对路径，如 /media/ktv）</label>
        <input id="scan-root" type="text" placeholder="/media/..." autocomplete="off">
        <label for="scan-policy">去重策略</label>
        <select id="scan-policy">
            <option value="skip">跳过已存在</option>
            <option value="rename">重命名</option>
            <option value="overwrite">覆盖</option>
        </select>
        <label><input type="checkbox" id="scan-validate" checked> ffprobe 校验</label>
        <div class="scan-preview" id="scan-preview"></div>
        <div class="scan-actions">
            <button type="button" id="scan-preview-btn">预览</button>
            <button type="button" id="scan-run-btn">执行扫描</button>
            <button type="button" id="scan-close-btn">关闭</button>
        </div>
    </div>
</div>
</body>
<script>
    localStorage.setItem("server", "{{ prefix }}");
</script>
<script src="/static/js/core/config.js"></script>
<script src="/static/js/core/http.js"></script>
<script src="/static/js/domains/library.js"></script>
<script src="/static/js/domains/queue.js"></script>
<script type="text/javascript" src="/static/js/pages/index.page.js"></script>
</html>
