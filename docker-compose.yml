services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-karaoke}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karaoke}
      POSTGRES_DB: ${POSTGRES_DB:-karaoke}
      # Used by docker/postgres/init-separator-db.sh when present (dedicated DB)
      SEPARATOR_POSTGRES_DB: ${SEPARATOR_POSTGRES_DB:-separator}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-karaoke} -d ${POSTGRES_DB:-karaoke}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  karaoke:
    image: ghcr.io/nazo-x1/karaoke:latest
    build: .
    ports:
      - "15233:15233"
    volumes:
      - karaoke-data:/KTV
    environment:
      - PREPARE_MAX_CONCURRENT=${PREPARE_MAX_CONCURRENT:-2}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-karaoke}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-karaoke}
      - POSTGRES_DB=${POSTGRES_DB:-karaoke}
      # 工坊 AI（默认关闭；启用需另起 separator，见仓库外/根 compose profile）
      - SEPARATOR_ENABLED=${SEPARATOR_ENABLED:-false}
      - SEPARATOR_BASE_URL=${SEPARATOR_BASE_URL:-http://separator:8080}
      - SEPARATOR_API_TOKEN=${SEPARATOR_API_TOKEN:-}
      - SEPARATOR_CALLBACK_BASE_URL=${SEPARATOR_CALLBACK_BASE_URL:-http://karaoke:15233}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:15233/api/v1/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  karaoke-data:
  postgres-data:
