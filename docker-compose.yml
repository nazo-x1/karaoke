services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-karaoke}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karaoke}
      POSTGRES_DB: ${POSTGRES_DB:-karaoke}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-karaoke} -d ${POSTGRES_DB:-karaoke}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  karaoke:
    image: ghcr.io/nazo-x1/karaoke:latest
    build: .
    ports:
      - "15233:15233"
    volumes:
      - karaoke-data:/KTV
    environment:
      - FORCE_DB_RESET=0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-karaoke}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-karaoke}
      - POSTGRES_DB=${POSTGRES_DB:-karaoke}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  karaoke-data:
  postgres-data:
